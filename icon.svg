<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B263B" />
      <stop offset="100%" stop-color="#0D131F" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5C882" />
      <stop offset="100%" stop-color="#B5893E" />
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <!-- 真鍮の外枠・内枠 -->
  <rect x="28" y="28" width="456" height="456" rx="74" fill="none" stroke="url(#brassGrad)" stroke-width="10" />
  <rect x="44" y="44" width="424" height="424" rx="62" fill="none" stroke="#D9B66C" stroke-width="3" stroke-opacity="0.45" />
  <!-- 建築神殿・時計塔モチーフ -->
  <g fill="none" stroke="url(#brassGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- ペディメント（三角破風） -->
    <path d="M96 184L256 88L416 184H96Z" fill="#162032" />
    <!-- 時計・メダリオン -->
    <circle cx="256" cy="148" r="22" fill="#9E2A2B" stroke="#E5C882" stroke-width="8" />
    <!-- エンタブラチュア（梁） -->
    <rect x="104" y="184" width="304" height="28" fill="#1B263B" />
    <!-- 4本の列柱 -->
    <line x1="144" y1="212" x2="144" y2="368" stroke-width="20" />
    <line x1="218" y1="212" x2="218" y2="368" stroke-width="20" />
    <line x1="294" y1="212" x2="294" y2="368" stroke-width="20" />
    <line x1="368" y1="212" x2="368" y2="368" stroke-width="20" />
    <!-- 中央アーチ -->
    <path d="M218 280 A38 38 0 0 1 294 280" stroke-width="12" />
    <!-- 基壇 -->
    <rect x="88" y="368" width="336" height="32" rx="6" fill="#9E2A2B" />
    <line x1="72" y1="416" x2="440" y2="416" stroke-width="14" />
  </g>
</svg>
